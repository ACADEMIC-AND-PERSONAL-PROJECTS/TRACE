# ======================================#
#   demo --- Spring Boot Configurations #
#   Environnement: development          #
#=======================================#

# Application name
spring.application.name=api

# Databases configs
spring.datasource.url=jdbc:postgresql://localhost:9002/memory_db
spring.datasource.username=dev
spring.datasource.password=dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logs
logging.level.org.springframework=INFO
logging.level.me.khadimprojects.api=DEBUG

# Import env file
spring.config.import=optional:file:.env[.properties]

# Actuator
management.endpoints.web.exposure.include=[health, info, metrics]
management.endpoint.health.show-details=always

# My varaibale
provider.model.endpoint=${ENDPOINT}
provider.model.api-key=${API_KEY}
provider.model.model-name=${MODEL}